{% extends "portal/base.html" %}
{% block title %}My Badge — Tempus{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 90vh;">
  <div class="card" style="width: 460px; max-width: 92vw;">
    <div class="card-body p-4 text-center">
      <img src="/badge/{{ badge_id }}.png" alt="Kiosk sign-in QR badge" class="img-fluid rounded" style="max-width: 400px; width: 100%; background: #fff; padding: 16px;">
      <div class="text-muted small mt-3">Scan this at the kiosk to sign in and out.</div>
    </div>
  </div>
</div>
{% endblock %}
