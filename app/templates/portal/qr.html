{% extends "portal/base.html" %}
{% block title %}My QR Badge — Tempus{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="card" style="width: 360px;">
    <div class="card-body p-4 text-center">
      <div class="text-muted small mb-2"><i class="bi bi-qr-code me-1"></i> {{ person.name }}</div>
      <img src="/me/qr.png" alt="Your kiosk sign-in QR badge" class="img-fluid rounded" style="max-width: 300px; background: #fff; padding: 12px;">
      <div class="text-muted small mt-3">Scan this at the kiosk to sign in and out.</div>
    </div>
  </div>
</div>
{% endblock %}
